
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>📝 Smart To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <!-- Add Task -->
        <form id="taskForm" class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                maxlength="200"
                autocomplete="off"
                aria-label="New task"
                required
            >
            <button type="submit" id="addButton">+ Add Task</button>
        </form>

        <!-- Progress -->
        <section class="progress-section">
            <div class="progress-info">
                <span id="taskSummary">0 tasks</span>
                <span id="progressText">0% completed</span>
            </div>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </section>

        <!-- Task controls -->
        <div class="toolbar">
            <label class="check-all-label">
                <input type="checkbox" id="checkAll">
                <span>Check All</span>
            </label>

            <button type="button" id="clearCompleted" class="text-button">
                Clear Completed
            </button>
        </div>

        <!-- Filters -->
        <nav class="filters" aria-label="Filter tasks">
            <button type="button" class="filter-btn active" data-filter="all">
                All
            </button>
            <button type="button" class="filter-btn" data-filter="active">
                Active
            </button>
            <button type="button" class="filter-btn" data-filter="completed">
                Completed
            </button>
        </nav>

        <!-- Task list -->
        <ul id="taskList" aria-label="Your tasks"></ul>

        <div id="emptyMessage" class="empty-message">
            <div class="empty-icon">🎯</div>
            <h3>No tasks yet!</h3>
            <p>Add your first task above to get started.</p>
        </div>

        <footer>
            <span id="remainingCount">0 tasks remaining</span>
            <span>Made with HTML, CSS & JavaScript</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
